<?xml version="1.0" encoding="UTF-8"?>
<!-- Icona "Taglia la Frutta": fetta d'anguria + coltello. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Taglia la frutta">
  <circle cx="120" cy="120" r="113" fill="#FFFFFF" stroke="#DDEAD3" stroke-width="3"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#D9F0CC" stroke-width="7" opacity=".5"/>

  <!-- schizzi di succo -->
  <g fill="#FF4D6D">
    <circle cx="58" cy="86" r="6"/><circle cx="44" cy="120" r="5"/><circle cx="70" cy="62" r="4"/>
  </g>

  <!-- fetta d'anguria (semicerchio, lato piatto in alto) -->
  <path d="M40 150 A70 70 0 0 1 180 150 Z" fill="#2E9E48"/>
  <path d="M48 150 A62 62 0 0 1 172 150 Z" fill="#FFFFFF"/>
  <path d="M56 150 A54 54 0 0 1 164 150 Z" fill="#FF4D6D"/>
  <!-- semini -->
  <g fill="#2A1622">
    <ellipse cx="95" cy="172" rx="4" ry="6" transform="rotate(-15 95 172)"/>
    <ellipse cx="120" cy="180" rx="4" ry="6"/>
    <ellipse cx="145" cy="172" rx="4" ry="6" transform="rotate(15 145 172)"/>
    <ellipse cx="108" cy="160" rx="4" ry="6" transform="rotate(-8 108 160)"/>
    <ellipse cx="133" cy="160" rx="4" ry="6" transform="rotate(8 133 160)"/>
  </g>

  <!-- coltello -->
  <g transform="rotate(38 150 92)">
    <rect x="140" y="34" width="22" height="78" rx="7" fill="#C9CFDA"/>
    <rect x="140" y="34" width="9" height="78" rx="4" fill="#EAEEF5"/>
    <polygon points="140,112 162,112 151,128" fill="#C9CFDA"/>
    <rect x="136" y="110" width="30" height="40" rx="10" fill="#7A1F3D"/>
    <rect x="136" y="124" width="30" height="6" fill="#5A1630"/>
  </g>
</svg>
