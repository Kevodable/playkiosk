<?xml version="1.0" encoding="UTF-8"?>
<!-- Icona "Acchiappa la Talpa" — talpa nella buca, martello e stelline d'impatto. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Talpe">
  <circle cx="120" cy="120" r="113" fill="#FFFFFF" stroke="#DBE2F5" stroke-width="3"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#D7E0FF" stroke-width="7" opacity=".5"/>

  <!-- prato con zolle -->
  <path d="M18 158 Q120 138 222 158 L222 196 Q120 178 18 196 Z" fill="#7BCB4F"/>
  <path d="M18 158 Q120 138 222 158 L222 168 Q120 150 18 168 Z" fill="#8FD862"/>
  <g fill="#5FAe3a">
    <path d="M52 158 l-6 -12 4 13 z"/><path d="M70 156 l-4 -14 7 13 z"/>
    <path d="M180 156 l6 -13 -3 14 z"/><path d="M196 158 l5 -11 -2 12 z"/>
  </g>

  <!-- buca -->
  <ellipse cx="100" cy="158" rx="50" ry="19" fill="#5A3A2A"/>
  <ellipse cx="100" cy="155" rx="42" ry="14" fill="#3A2418"/>

  <!-- talpa -->
  <ellipse cx="100" cy="132" rx="31" ry="31" fill="#9B8579"/>
  <ellipse cx="100" cy="120" rx="26" ry="20" fill="#A89488"/>
  <ellipse cx="100" cy="146" rx="23" ry="18" fill="#D7C7BC"/>
  <!-- guance -->
  <circle cx="80" cy="138" r="7" fill="#FFB6C1" opacity=".8"/>
  <circle cx="120" cy="138" r="7" fill="#FFB6C1" opacity=".8"/>
  <!-- occhi -->
  <circle cx="90" cy="127" r="6.5" fill="#2A1622"/>
  <circle cx="110" cy="127" r="6.5" fill="#2A1622"/>
  <circle cx="92" cy="125" r="2" fill="#fff"/>
  <circle cx="112" cy="125" r="2" fill="#fff"/>
  <!-- naso -->
  <ellipse cx="100" cy="142" rx="7" ry="5" fill="#E8488B"/>
  <!-- baffi -->
  <g stroke="#2A1622" stroke-width="2" stroke-linecap="round" opacity=".6">
    <path d="M84 146 l-14 -3"/><path d="M84 150 l-13 2"/>
    <path d="M116 146 l14 -3"/><path d="M116 150 l13 2"/>
  </g>

  <!-- stelline d'impatto -->
  <g fill="#FFD23F">
    <path d="M150 86 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z"/>
    <path d="M58 96 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z"/>
  </g>

  <!-- martello -->
  <g transform="rotate(22 168 92)">
    <rect x="160" y="86" width="15" height="70" rx="7" fill="#7A1F3D"/>
    <rect x="138" y="58" width="56" height="32" rx="10" fill="#2E5BFF"/>
    <rect x="138" y="58" width="56" height="32" rx="10" fill="none" stroke="#1E40D8" stroke-width="3"/>
    <rect x="146" y="64" width="18" height="9" rx="4" fill="#7C97FF"/>
  </g>
</svg>
