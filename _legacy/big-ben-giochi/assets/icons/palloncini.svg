<?xml version="1.0" encoding="UTF-8"?>
<!-- Icona "Scoppia i Palloncini" — grappolo di palloncini, coriandoli e stelline. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Palloncini">
  <circle cx="120" cy="120" r="113" fill="#FFFFFF" stroke="#EADFE6" stroke-width="3"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#D7E0FF" stroke-width="7" opacity=".45"/>

  <!-- coriandoli / stelline -->
  <g>
    <rect x="48" y="150" width="10" height="10" rx="2" fill="#34C759" transform="rotate(20 53 155)"/>
    <rect x="186" y="150" width="10" height="10" rx="2" fill="#E8488B" transform="rotate(-15 191 155)"/>
    <circle cx="58" cy="92" r="5" fill="#FFD23F"/>
    <circle cx="182" cy="100" r="5" fill="#2E5BFF"/>
    <path d="M150 64 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z" fill="#FFD23F"/>
  </g>

  <!-- fili -->
  <g fill="none" stroke="#9A8A93" stroke-width="3" stroke-linecap="round">
    <path d="M86 128 Q102 162 118 192"/>
    <path d="M150 120 Q138 160 120 192"/>
    <path d="M120 138 Q120 165 119 192"/>
  </g>
  <!-- nodino in fondo -->
  <circle cx="119" cy="192" r="4" fill="#9A8A93"/>

  <!-- palloncino verde (dietro sx) -->
  <ellipse cx="74" cy="96" rx="29" ry="35" fill="#34C759"/>
  <ellipse cx="64" cy="84" rx="8" ry="12" fill="#FFFFFF" opacity=".5"/>
  <path d="M74 129 l-7 10 14 0 Z" fill="#34C759"/>

  <!-- palloncino giallo (dietro dx) -->
  <ellipse cx="150" cy="88" rx="30" ry="36" fill="#FFD23F"/>
  <ellipse cx="140" cy="76" rx="8" ry="12" fill="#FFFFFF" opacity=".55"/>
  <path d="M150 122 l-7 10 14 0 Z" fill="#FFD23F"/>

  <!-- palloncino blu (dietro centro) -->
  <ellipse cx="98" cy="74" rx="26" ry="32" fill="#2E5BFF"/>
  <ellipse cx="90" cy="64" rx="7" ry="10" fill="#FFFFFF" opacity=".45"/>
  <path d="M98 104 l-6 9 12 0 Z" fill="#2E5BFF"/>

  <!-- palloncino rosa (davanti) -->
  <ellipse cx="118" cy="108" rx="34" ry="41" fill="#E8488B"/>
  <ellipse cx="106" cy="94" rx="10" ry="14" fill="#FFFFFF" opacity=".5"/>
  <ellipse cx="128" cy="124" rx="9" ry="13" fill="#C0306B" opacity=".35"/>
  <path d="M118 147 l-8 11 16 0 Z" fill="#E8488B"/>
</svg>
