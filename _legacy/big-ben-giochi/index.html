<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <!-- Viewport bloccato: no zoom utente, fullscreen kiosk -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7A1F3D">
  <title>Kids Fun Planet — Giochi</title>
  <!-- Path relativo: GitHub Pages serve da sottocartella -->
  <link rel="stylesheet" href="assets/shared.css">
  <style>
    /* ----- Stili specifici della gallery ----- */
    .gallery{
      display:flex;
      flex-direction:column;
      height:100%;
    }
    .gallery__head{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      padding:22px 18px 10px;
      text-align:center;
    }
    .gallery__logo{ height:18vmin; height:clamp(80px,18vmin,160px); width:auto; display:block; }
    .gallery__title{
      font-size:6vmin; font-size:clamp(24px,6vmin,44px);
      font-weight:900;
      color:var(--bb-burgundy);
      letter-spacing:.5px;
    }
    .gallery__subtitle{
      flex:0 0 auto;
      text-align:center;
      font-size:2.6vmin; font-size:clamp(13px,2.6vmin,18px);
      font-weight:700;
      color:var(--bb-pink);
      margin-bottom:8px;
    }
    /* Griglia di tile responsive: si adatta a landscape e portrait */
    .gallery__grid{
      flex:1 1 auto;
      min-height:0;
      display:grid;
      gap:3vmin; gap:clamp(14px,3vmin,28px);
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      align-content:center;
      justify-content:center;
      padding:3vmin; padding:clamp(14px,3vmin,32px);
      overflow:hidden;
    }
    /* Una tile = grande target tap, colorata, con icona enorme */
    .tile{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:28vmin; min-height:clamp(150px,28vmin,240px);
      padding:18px;
      border-radius:var(--bb-radius-lg);
      color:#fff;
      box-shadow:var(--bb-shadow-strong);
      transition:transform .14s var(--bb-ease-elastic);
      text-align:center;
    }
    .tile:active{ transform:scale(.94); }
    .tile__icon{ font-size:12vmin; font-size:clamp(48px,12vmin,92px); line-height:1; }
    /* Icona-mascotte (immagine) al posto dell'emoji */
    .tile__img{ height:18vmin; height:clamp(72px,18vmin,128px); width:auto; display:block;
      filter:drop-shadow(0 6px 10px rgba(0,0,0,.18)); }
    .tile__name{ font-size:3.6vmin; font-size:clamp(18px,3.6vmin,28px); font-weight:900; }
    .tile__desc{
      font-size:2.4vmin; font-size:clamp(12px,2.4vmin,17px);
      font-weight:600;
      opacity:.92;
      max-width:90%;
    }
    .gallery__msg{
      margin:auto;
      text-align:center;
      font-size:20px;
      font-weight:700;
      color:var(--bb-burgundy);
      padding:24px;
    }
  </style>
</head>
<body>
  <div class="bb-screen">
    <div class="gallery">
      <div class="gallery__head">
        <img class="gallery__logo" id="logo" src="assets/logo.png" alt="Kids Fun Planet">
      </div>
      <div class="gallery__subtitle">Scegli un gioco e divertiti!</div>
      <div class="gallery__grid" id="grid">
        <!-- Le tile vengono iniettate da JS leggendo giochi.json -->
      </div>
    </div>
  </div>

  <script src="assets/shared.js"></script>
  <script>
    // Blocca lo scroll del kiosk
    BB.lockScroll();

    var grid = document.getElementById("grid");

    // Multi-tenant (solo per l'accesso da browser): ?client=<id> carica la gallery
    // di quel cliente. Senza parametro = Big Ben Matic (gallery root, comportamento storico).
    // Nell'APK questa pagina non è usata: il launcher mostra le tile native da config.json.
    var CLIENT = new URLSearchParams(window.location.search).get("client");
    var manifestUrl = CLIENT ? "../launcher/clients/" + CLIENT + "/giochi.json" : "giochi.json";
    var suffix = CLIENT ? "?client=" + encodeURIComponent(CLIENT) : "";

    // Applica il branding del cliente (best-effort: se manca, resta quello di default)
    function applicaBranding(b) {
      if (!b) return;
      if (b.appTitle) document.title = b.appTitle;
      var logo = document.getElementById("logo");
      if (logo && b.logoUrl) logo.src = b.logoUrl;
      if (b.backgroundUrl) {
        var screen = document.querySelector(".bb-screen");
        if (screen) {
          screen.style.background =
            "center/cover no-repeat url('" + b.backgroundUrl + "'), var(--bb-paper)";
        }
      }
      if (b.primaryColor) document.documentElement.style.setProperty("--bb-burgundy", b.primaryColor);
    }
    if (CLIENT) {
      fetch("../launcher/clients/" + CLIENT + "/config.json", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (c) { applicaBranding(c && c.defaults && c.defaults.branding); })
        .catch(function () { /* branding opzionale: si prosegue con quello di default */ });
    }

    // Mostra un messaggio centrale (loading / errore)
    function mostraMessaggio(txt) {
      grid.innerHTML = '<div class="gallery__msg">' + txt + "</div>";
    }

    // Costruisce una tile cliccabile per un gioco
    function creaTile(gioco) {
      var tile = document.createElement("button");
      tile.className = "tile";
      tile.style.background = gioco.colore || "var(--bb-pink)";
      // Icona: mascotte (immagine) se presente, altrimenti emoji
      var icona = gioco.iconImg
        ? '<img class="tile__img" src="' + gioco.iconImg + '" alt="">'
        : '<span class="tile__icon">' + (gioco.icona || "🎮") + "</span>";
      tile.innerHTML =
        icona +
        '<span class="tile__name">' + gioco.nome + "</span>" +
        (gioco.descrizione
          ? '<span class="tile__desc">' + gioco.descrizione + "</span>"
          : "");
      // Tap → apre il gioco (path relativo verso la sua cartella)
      tile.addEventListener("click", function () {
        BB.sound("pop");
        // Propaga ?client così il gioco (e il suo ritorno a casa) resta nel contesto del cliente
        window.location.href = gioco.cartella + "/index.html" + suffix;
      });
      return tile;
    }

    // Renderizza solo i giochi attivi
    function render(giochi) {
      var attivi = (giochi || []).filter(function (g) { return g.attivo; });
      if (!attivi.length) {
        mostraMessaggio("Nessun gioco disponibile 😴");
        return;
      }
      grid.innerHTML = "";
      attivi.forEach(function (g) { grid.appendChild(creaTile(g)); });
    }

    mostraMessaggio("Caricamento… ⏳");

    // Carica il manifest (cliente o root). cache:no-store così l'admin può aggiornarlo.
    fetch(manifestUrl, { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(render)
      .catch(function () {
        mostraMessaggio("Impossibile caricare i giochi 😢<br>Riprova più tardi.");
      });
  </script>
</body>
</html>
