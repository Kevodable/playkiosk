<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7A1F3D">
  <title>Rompicapo scorrevole</title>
  <link rel="stylesheet" href="../assets/shared.css?v=3">
  <style>
    .bb-screen{
      background:
        radial-gradient(circle at 18% 22%, rgba(255,255,255,.55) 0 4px, transparent 5px) 0 0 / 80px 80px,
        linear-gradient(to bottom, #E8F7E4 0%, #D8F0D2 60%, #C6E6BD 100%);
    }
    .scena{ position:absolute; top:0; right:0; bottom:0; left:0;
      display:flex; align-items:center; justify-content:center; gap:4vmin; }
    .tartaruga{ height:46vmin; height:min(46vmin,460px); width:auto; align-self:flex-end; margin-bottom:3vmin;
      transform-origin:50% 100%; pointer-events:none; }
    .lato{ display:flex; flex-direction:column; align-items:center; gap:2vmin; }
    /* Vassoio di legno, come l'icona */
    .vassoio{
      padding:2.2vmin; border-radius:3vmin;
      background:
        repeating-linear-gradient(8deg, rgba(120,70,30,.08) 0 3px, transparent 3px 18px),
        linear-gradient(to bottom, #E2A866, #C9864A);
      border:.7vmin solid #8A5328;
      box-shadow:inset 0 .6vmin 0 rgba(255,235,200,.55), inset 0 -.9vmin 0 rgba(110,60,20,.35), 0 12px 22px rgba(90,50,20,.3);
    }
    .board{
      position:relative;
      width:78vmin; width:min(78vmin, 820px);
      aspect-ratio:1/1;
      background:#7A4A22; border-radius:1.6vmin;
      box-shadow:inset 0 .6vmin 1.2vmin rgba(0,0,0,.35);
    }
    /* Una tessera: porzione dell'immagine */
    .tile{
      position:absolute; left:0; top:0;
      border:0; padding:0; margin:0;
      border-radius:1.4vmin;
      background-repeat:no-repeat;
      box-shadow:inset 0 0 0 .3vmin rgba(255,255,255,.55), 0 .5vmin .8vmin rgba(0,0,0,.3);
      cursor:pointer; touch-action:manipulation;
      will-change:transform;
    }
    .tile__num{
      position:absolute; left:6%; top:5%;
      min-width:3.4vmin; height:3.4vmin; padding:0 .8vmin;
      border-radius:999px; background:rgba(62,40,20,.8); color:#fff;
      font-size:2.2vmin; font-weight:900; line-height:3.4vmin; text-align:center;
    }
    /* Anteprima dell'immagine completa */
    .anteprima{ position:absolute; inset:0; border-radius:1.6vmin; background-size:cover; opacity:0; pointer-events:none; z-index:5;
      box-shadow:0 0 0 .6vmin #FFE14D; }

    /* Schermata di start */
    .start{
      position:absolute; top:0; right:0; bottom:0; left:0; inset:0; z-index:30;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:20px;
      background:rgba(236,248,232,.94);
      text-align:center;
    }
    .start__img{ width:34vmin; width:clamp(150px,34vmin,260px); height:auto;
      filter:drop-shadow(0 8px 14px rgba(0,0,0,.2)); }
    .start__txt{ font-size:3.2vmin; font-size:clamp(18px,3.2vmin,30px); font-weight:900; color:#3C7A2E; }
    .liv-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  </style>
</head>
<body>
  <div class="bb-screen">
    <!-- header iniettato da JS -->
    <div class="bb-stage">
      <div class="scena">
        <img class="tartaruga" id="tartaruga" src="img/tartaruga.webp" alt="">
        <div class="lato">
          <div class="vassoio"><div class="board" id="board"><div class="anteprima" id="anteprima"></div></div></div>
        </div>
        <button class="bb-btn bb-btn--blue" id="sbircia" style="align-self:flex-start;margin-top:4vmin">👀 Sbircia</button>
      </div>
      <div class="start" id="start">
        <img class="start__img" src="../assets/icons/puzzle.svg" alt="">
        <div class="start__txt">Rimetti in ordine l'immagine!<br>Scegli la difficoltà:</div>
        <div class="liv-row">
          <button class="bb-btn bb-btn--burgundy liv-btn" data-liv="facile">😊 Facile</button>
          <button class="bb-btn bb-btn--burgundy liv-btn" data-liv="medio">😎 Medio</button>
          <button class="bb-btn bb-btn--burgundy liv-btn" data-liv="difficile">🔥 Difficile</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/shared.js?v=2"></script>
  <script>
    /* =====================================================================
       CONFIG: tutti i numeri del gioco, da ritoccare qui.
       ===================================================================== */
    var CONFIG = {
      // Difficolta': lato della griglia e se mostrare i numeri guida
      DIFFICOLTA: {
        facile:    { n: 3, numeri: true },
        medio:     { n: 4, numeri: false },
        difficile: { n: 5, numeri: false }
      },
      SCORRI_MS: 160,              // durata dello scivolamento di una tessera
      SBIRCIA_MS: 2000,            // quanto resta visibile l'immagine completa
      MESCOLA_PASSI: 30,           // mosse casuali per casella usate per mescolare
      INATTIVITA_MS: 60000         // senza tocchi: torna al menu giochi
    };
    // Le immagini: la famiglia di animali (tools/build_puzzle_sprites.py)
    var QUADRI = ["talpa", "gufo", "orsetto", "panda", "volpe", "pinguino", "topo", "coniglio", "rana", "elefante", "gattino"];

    BB.lockScroll();
    var info = BB.header("Rompicapo");
    BB.idle(CONFIG.INATTIVITA_MS, BB.home);

    var board = document.getElementById("board");
    var anteprima = document.getElementById("anteprima");
    var tartaruga = document.getElementById("tartaruga");
    var startScreen = document.getElementById("start");

    var N = 3, IMG = "", NUMERI = true, ultimoQuadro = -1;
    var cells = [];      // cells[posizione] = valore tessera (0..N*N-1); N*N-1 = vuoto
    var EMPTY = 0;
    var tiles = {};      // valore -> elemento
    var mosse = 0, inCorso = false, lato = 0, passo = 0;

    function aggiornaInfo(){ info.textContent = "👣 " + mosse; }
    function rc(pos){ return { r: Math.floor(pos / N), c: pos % N }; }

    // ---- Tartaruga ----
    var animT = null;
    function tAnima(frames, ms){ if (animT) animT.cancel(); animT = tartaruga.animate(frames, { duration: ms, easing: "ease-out" }); }
    function tAnnuisce(){ tAnima([{ transform:"none" }, { transform:"rotate(-3deg) translateY(-2%)", offset:.4 }, { transform:"none" }], 280); }
    function tFesta(){ tAnima([{ transform:"none" }, { transform:"translateY(-12%) rotate(-5deg)", offset:.2 }, { transform:"none", offset:.4 },
      { transform:"translateY(-12%) rotate(5deg)", offset:.6 }, { transform:"none", offset:.8 }, { transform:"translateY(-6%)", offset:.9 }, { transform:"none" }], 1300); }

    // ---- Nuova partita: griglia risolta, poi mescolata con mosse valide (sempre risolvibile) ----
    function nuova(liv){
      var d = CONFIG.DIFFICOLTA[liv] || CONFIG.DIFFICOLTA.facile;
      N = d.n; NUMERI = d.numeri; EMPTY = N * N - 1;
      var q; do { q = BB.rand(0, QUADRI.length - 1); } while (q === ultimoQuadro && QUADRI.length > 1);
      ultimoQuadro = q; IMG = "img/quadro_" + QUADRI[q] + ".webp";
      anteprima.style.backgroundImage = "url(" + IMG + ")";
      cells = []; for (var i = 0; i < N * N; i++) cells.push(i);
      mescola();
      mosse = 0; inCorso = true;
      costruisci(); aggiornaInfo();
      startScreen.classList.add("bb-hidden");
    }

    function mescola(){
      var vuoto = cells.indexOf(EMPTY), ultimo = -1;
      for (var k = 0; k < N * N * CONFIG.MESCOLA_PASSI; k++){
        var vicini = adiacenti(vuoto).filter(function(p){ return p !== ultimo; });
        var scelto = vicini[BB.rand(0, vicini.length - 1)];
        cells[vuoto] = cells[scelto]; cells[scelto] = EMPTY;
        ultimo = vuoto; vuoto = scelto;
      }
      if (risolto()) mescola();      // evita di partire gia' risolto
    }
    function adiacenti(pos){
      var p = rc(pos), out = [];
      if (p.r > 0) out.push(pos - N);
      if (p.r < N - 1) out.push(pos + N);
      if (p.c > 0) out.push(pos - 1);
      if (p.c < N - 1) out.push(pos + 1);
      return out;
    }

    // Tessere create una volta per partita; si spostano con transform
    function geometria(){ lato = board.clientWidth; passo = lato / N; }
    function xy(pos){ var p = rc(pos), g = passo * .03; return { x: p.c * passo + g, y: p.r * passo + g }; }
    function costruisci(){
      Object.keys(tiles).forEach(function (k) { tiles[k].remove(); });
      tiles = {}; geometria();
      for (var pos = 0; pos < N * N; pos++){
        var val = cells[pos]; if (val === EMPTY) continue;
        var t = document.createElement("button");
        t.className = "tile";
        var tr = Math.floor(val / N), tc = val % N;
        t.style.backgroundImage = "url(" + IMG + ")";
        t.style.backgroundSize = (N * 100 / .94) + "% " + (N * 100 / .94) + "%";
        // la tessera e' il 94% della cella, spostata del 3%: la sua porzione di
        // immagine parte da (col + .03) celle, su una corsa di (N - .94) celle
        t.style.backgroundPosition = ((tc + .03) * 100 / (N - .94)) + "% " + ((tr + .03) * 100 / (N - .94)) + "%";
        if (NUMERI){ var num = document.createElement("span"); num.className = "tile__num"; num.textContent = val + 1; t.appendChild(num); }
        (function (v) { t.addEventListener("pointerdown", function (e) { e.preventDefault(); tocca(v); }); })(val);
        board.appendChild(t); tiles[val] = t;
      }
      disponi();
    }
    function disponi(){
      geometria();
      var s = passo * .94;
      for (var pos = 0; pos < N * N; pos++){
        var val = cells[pos]; if (val === EMPTY) continue;
        var t = tiles[val], q = xy(pos);
        t.style.width = t.style.height = s + "px";
        t.style.transform = "translate(" + q.x + "px," + q.y + "px)";
      }
    }

    function tocca(val){
      if (!inCorso) return;
      var pos = cells.indexOf(val), vuoto = cells.indexOf(EMPTY);
      if (adiacenti(pos).indexOf(vuoto) < 0) return;   // non adiacente al vuoto
      cells[vuoto] = val; cells[pos] = EMPTY;
      var t = tiles[val], a = xy(pos), b = xy(vuoto);
      t.animate([{ transform: "translate(" + a.x + "px," + a.y + "px)" }, { transform: "translate(" + b.x + "px," + b.y + "px)" }],
                { duration: CONFIG.SCORRI_MS, easing: "ease-out" });
      t.style.transform = "translate(" + b.x + "px," + b.y + "px)";
      mosse++; BB.sound("pop"); aggiornaInfo(); tAnnuisce();
      if (risolto()) vittoria();
    }

    function risolto(){
      for (var i = 0; i < cells.length; i++) if (cells[i] !== i) return false;
      return true;
    }

    function sbircia(){
      if (!inCorso) return;
      anteprima.animate([{ opacity: 0 }, { opacity: 1, offset: .12 }, { opacity: 1, offset: .85 }, { opacity: 0 }],
                        { duration: CONFIG.SBIRCIA_MS, fill: "forwards" });
    }
    document.getElementById("sbircia").addEventListener("click", sbircia);

    function vittoria(){
      inCorso = false;
      tFesta(); BB.sound("win");
      // l'immagine completa appare sopra le tessere
      anteprima.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: CONFIG.SCORRI_MS, fill: "forwards" });
      setTimeout(function () {
        BB.win({
          mascotte: IMG,
          titolo: "Completato!",
          punteggio: mosse + " mosse",
          rigioca: function(){ anteprima.getAnimations().forEach(function (a) { a.cancel(); }); startScreen.classList.remove("bb-hidden"); }
        });
      }, 1400);
    }

    window.addEventListener("resize", function () { if (inCorso) disponi(); });
    Array.prototype.forEach.call(document.querySelectorAll(".liv-btn"), function(b){
      b.addEventListener("click", function(){ nuova(b.dataset.liv); });
    });
  </script>
</body>
</html>
