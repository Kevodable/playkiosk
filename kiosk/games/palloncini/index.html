<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7A1F3D">
  <title>Scoppia i Palloncini</title>
  <link rel="stylesheet" href="../assets/shared.css?v=2">
  <style>
    /* ----- Cielo con nuvole, coerente con l'icona ----- */
    .bb-stage{ padding:0; }
    .campo{
      position:absolute; top:0; right:0; bottom:0; left:0;
      overflow:hidden;
      background:linear-gradient(to bottom, #9FD8FF 0%, #C9EBFF 55%, #EAF8FF 100%);
    }
    /* Nuvola: tre cerchi bianchi sovrapposti, scorre piano da sinistra a destra */
    .nuvola{
      position:absolute; left:-30vmin;
      width:var(--w); height:calc(var(--w) * .42);
      pointer-events:none;
      opacity:.9;
      animation-name:nuvola; animation-timing-function:linear; animation-iteration-count:infinite;
    }
    .nuvola::before, .nuvola::after, .nuvola i{
      content:""; position:absolute; background:#fff; border-radius:50%;
    }
    .nuvola i{ left:0; right:0; bottom:0; height:55%; border-radius:999px; }
    .nuvola::before{ left:14%; bottom:22%; width:42%; height:78%; }
    .nuvola::after{ left:44%; bottom:28%; width:34%; height:64%; }
    @keyframes nuvola{ from{ transform:translateX(0); } to{ transform:translateX(calc(100vw + 60vmin)); } }

    /* Orsetto in basso a sinistra: guarda i palloncini e sobbalza agli scoppi */
    .orsetto{
      position:absolute; left:2vmin; bottom:0;
      height:30vmin; height:clamp(150px,30vmin,300px); width:auto;
      pointer-events:none;
      transform-origin:50% 100%;
    }

    /* Un palloncino: sprite dell'icona + filo che ondeggia. Tutto il bottone
       (palloncino e filo) e' il bersaglio del tocco. */
    .palloncino{
      position:absolute; left:0; top:0;
      width:var(--size,96px);
      height:calc(var(--size,96px) * 1.27 + var(--size,96px) * .75);
      display:block;
      padding:0; border:0; background:none;
      will-change:transform;
      touch-action:manipulation;
    }
    .palloncino__corpo{
      position:absolute; left:0; top:0;
      width:100%; height:calc(var(--size,96px) * 1.27);   /* proporzioni dello sprite 215x273 */
      display:block;
      pointer-events:none;
      filter:drop-shadow(0 6px 8px rgba(40,70,110,.18));
    }
    .palloncino__filo{
      position:absolute;
      left:calc(49.3% - var(--size,96px) * .15); top:calc(var(--size,96px) * 1.25);
      width:calc(var(--size,96px) * .3); height:calc(var(--size,96px) * .75);
      overflow:visible;
      pointer-events:none;
      transform-origin:50% 0;
    }

    /* Palloncino speciale: dorato, con stella e bagliore; scoppiando fa
       scoppiare anche i palloncini vicini */
    .palloncino.speciale .palloncino__corpo{
      filter:drop-shadow(0 0 calc(var(--size,96px) * .12) rgba(255,210,63,.95)) drop-shadow(0 6px 8px rgba(40,70,110,.18));
    }
    .palloncino__stella{
      position:absolute; left:26%; top:24%; width:48%; aspect-ratio:1;
      pointer-events:none;
      filter:drop-shadow(0 1px 2px rgba(150,90,0,.6));
    }
    /* Onda d'urto dello speciale */
    .onda{
      position:absolute; border-radius:50%;
      border:6px solid #FFD23F;
      box-shadow:0 0 18px rgba(255,210,63,.8), inset 0 0 18px rgba(255,210,63,.6);
      pointer-events:none;
    }

    /* Scoppio (come nell'icona): raggi, coriandoli e brandelli di gomma */
    .scoppio{
      position:absolute; width:1px; height:1px;
      pointer-events:none;
      overflow:visible;
    }

    /* Schermata di start */
    .start{
      position:absolute; top:0; right:0; bottom:0; left:0; inset:0; z-index:30;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:22px;
      background:rgba(236,248,255,.9);
      text-align:center;
    }
    .start__img{ width:34vmin; width:clamp(150px,34vmin,260px); height:auto;
      filter:drop-shadow(0 8px 14px rgba(0,0,0,.2)); }
    .start__txt{ font-size:5vmin; font-size:clamp(20px,5vmin,34px); font-weight:900; color:var(--bb-burgundy); }
    .liv-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  </style>
</head>
<body>
  <div class="bb-screen">
    <!-- header iniettato da JS -->
    <div class="bb-stage">
      <div class="campo" id="campo">
        <img class="orsetto" id="orsetto" src="img/orsetto.webp" alt="">
        <div class="start" id="start">
          <img class="start__img" src="../assets/icons/palloncini.svg" alt="">
          <div class="start__txt">Scoppia i palloncini!<br>Scegli la difficoltà:</div>
          <div class="liv-row">
            <button class="bb-btn bb-btn--burgundy liv-btn" data-liv="facile">😊 Facile</button>
            <button class="bb-btn bb-btn--burgundy liv-btn" data-liv="medio">😎 Medio</button>
            <button class="bb-btn bb-btn--burgundy liv-btn" data-liv="difficile">🔥 Difficile</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/shared.js?v=2"></script>
  <script>
    /* =====================================================================
       CONFIG: tutti i numeri del gioco, da ritoccare qui.
       ===================================================================== */
    var CONFIG = {
      DURATA_PARTITA: 60,          // secondi di partita
      PUNTI_PER_PALLONCINO: 1,
      // Difficoltà: vy = velocità di salita (px/s, cresce di vyScore per punto);
      // spawnBase/spawnMin = ms tra un palloncino e il successivo (cala col tempo
      // di SPAWN_CALO_MS per ogni secondo di gioco, fino a spawnMin).
      DIFFICOLTA: {
        facile:    { vyMin: 55, vyMax: 90,  vyScore: 0.8, spawnBase: 1100, spawnMin: 520 },
        medio:     { vyMin: 70, vyMax: 120, vyScore: 1.2, spawnBase: 900,  spawnMin: 380 },
        difficile: { vyMin: 95, vyMax: 150, vyScore: 1.7, spawnBase: 720,  spawnMin: 300 }
      },
      SPAWN_CALO_MS: 8,
      DIMENSIONE_MIN: 78,          // larghezza del palloncino in px
      DIMENSIONE_MAX: 130,
      COLORI: ["rosso", "giallo", "blu", "verde", "viola", "arancio", "rosa"],
      FILO_OSCILLAZIONE: 14,       // gradi di oscillazione del filo
      ONDEGGIAMENTO_PX: 18,        // quanto il palloncino ondeggia a destra e sinistra
      ONDEGGIAMENTO_VELOCITA: 1.6, // oscillazioni al secondo x 2pi (piu' alto = piu' veloce)
      INCLINAZIONE: 6,             // gradi di inclinazione mentre ondeggia
      SPECIALE_PROBABILITA: 0.08,  // quanti palloncini nascono speciali (dorati con stella)
      SPECIALE_RAGGIO: 3.2,        // raggio dell'onda, in larghezze del palloncino speciale
      SPECIALE_ONDA_MS: 420,       // quanto ci mette l'onda ad arrivare al bordo del raggio
      NUVOLE: 4,
      INATTIVITA_MS: 60000         // senza tocchi: torna al menu giochi
    };
    // colore di raggi e brandelli dello scoppio, per ogni palloncino
    var TINTA = { rosso: "#E8424F", giallo: "#F4C21B", blu: "#3E8BE0", verde: "#3DBE52",
                  viola: "#9B4FD8", arancio: "#F28A2E", rosa: "#E84C9A" };
    var STELLA = (function () {       // punti di una stella a 5 punte (raggio 44)
      var pts = [];
      for (var i = 0; i < 10; i++) {
        var r = i % 2 ? 19 : 44, a = (-90 + i * 36) * Math.PI / 180;
        pts.push((Math.cos(a) * r).toFixed(1) + "," + (Math.sin(a) * r).toFixed(1));
      }
      return pts.join(" ");
    })();
    var CORIANDOLI = ["#E8424F", "#9B5DC9", "#FFD23F", "#3FA7E8", "#FF8A3D", "#58C27D"];

    BB.lockScroll();
    var info = BB.header("Scoppia i Palloncini");
    BB.idle(CONFIG.INATTIVITA_MS, BB.home);

    var campo = document.getElementById("campo");
    var startScreen = document.getElementById("start");
    var orsetto = document.getElementById("orsetto");
    var DIFF = CONFIG.DIFFICOLTA.facile;

    var punteggio = 0;
    var tempo = CONFIG.DURATA_PARTITA;
    var inCorso = false;
    var palloncini = [];          // {el, x, y, vy, size, drift, phase}
    var ultimoSpawn = 0;
    var spawnOgni = 900;          // ms tra una nascita e l'altra (cala col tempo)
    var rafId = null;
    var tickTimer = null;
    var lastTs = 0;

    // Nuvole: posizioni e velocità diverse, partono gia' sparse nel cielo
    for (var n = 0; n < CONFIG.NUVOLE; n++) {
      var nv = document.createElement("div");
      nv.className = "nuvola";
      nv.innerHTML = "<i></i>";
      nv.style.setProperty("--w", BB.rand(16, 28) + "vmin");
      nv.style.top = (6 + n * 17 + BB.rand(0, 8)) + "%";
      var dur = BB.rand(55, 90);
      nv.style.setProperty("animation-duration", dur + "s", "important");
      nv.style.animationDelay = -(dur * (n + Math.random()) / CONFIG.NUVOLE) + "s";
      campo.insertBefore(nv, orsetto);
    }

    function aggiornaInfo() {
      info.innerHTML = "⭐ " + punteggio + " &nbsp; ⏱ " + tempo + "s";
    }

    // Crea un palloncino in basso e lo registra nel game loop
    function spawn() {
      var size = BB.rand(CONFIG.DIMENSIONE_MIN, CONFIG.DIMENSIONE_MAX);
      var speciale = Math.random() < CONFIG.SPECIALE_PROBABILITA;
      var colore = speciale ? "giallo" : CONFIG.COLORI[BB.rand(0, CONFIG.COLORI.length - 1)];
      var el = document.createElement("button");
      el.className = "palloncino" + (speciale ? " speciale" : "");
      el.style.setProperty("--size", size + "px");
      el.innerHTML =
        '<svg class="palloncino__filo" viewBox="0 0 30 75" preserveAspectRatio="none">' +
          '<path d="M15 0 Q24 18 15 36 Q6 54 15 75" fill="none" stroke="#4A2C22" stroke-width="1.6" ' +
          'stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>' +
        '<img class="palloncino__corpo" src="img/palloncino_' + colore + '.webp" alt="">' +
        (speciale ? '<svg class="palloncino__stella" viewBox="-50 -50 100 100"><polygon points="' + STELLA +
                    '" fill="#fff" stroke="#E0A000" stroke-width="5" stroke-linejoin="round"/></svg>' : "");
      if (speciale) {   // la stella pulsa
        el.querySelector(".palloncino__stella").animate(
          [{ transform: "scale(.9) rotate(-8deg)" }, { transform: "scale(1.12) rotate(8deg)" }],
          { duration: 600, direction: "alternate", iterations: Infinity, easing: "ease-in-out" });
      }
      // il filo ondeggia (Web Animations: non risente di "riduci movimento")
      el.querySelector(".palloncino__filo").animate(
        [{ transform: "rotate(" + -CONFIG.FILO_OSCILLAZIONE + "deg)" },
         { transform: "rotate(" + CONFIG.FILO_OSCILLAZIONE + "deg)" }],
        { duration: BB.rand(900, 1400), direction: "alternate", iterations: Infinity, easing: "ease-in-out" });

      var W = campo.clientWidth;
      var H = campo.clientHeight;
      var p = {
        el: el,
        size: size,
        x: BB.rand(10 + CONFIG.ONDEGGIAMENTO_PX, Math.max(10 + CONFIG.ONDEGGIAMENTO_PX, W - size - 10 - CONFIG.ONDEGGIAMENTO_PX)),
        y: H + 20,
        // velocità di salita in px/sec (cresce col punteggio e con la difficoltà)
        vy: BB.rand(DIFF.vyMin, DIFF.vyMax) + punteggio * DIFF.vyScore,
        drift: CONFIG.ONDEGGIAMENTO_PX * (0.5 + Math.random() * 0.5),   // ampiezza di questo palloncino
        phase: Math.random() * Math.PI * 2,
        colore: colore,
        speciale: speciale,
        ox: 0,
        popped: false
      };
      el.style.transform = "translate(" + p.x + "px," + p.y + "px)";

      // Tocco → scoppia subito (pointerdown: risponde appena il dito tocca)
      el.addEventListener("pointerdown", function () { scoppia(p); });
      campo.appendChild(el);
      palloncini.push(p);
    }

    // Scoppio come nell'icona: raggi arancioni, coriandoli, brandelli di gomma
    function scoppio(cx, cy, size, colore) {
      var r0 = size * .42, r1 = size * .72, dc = size * .9;
      var svg = "";
      for (var i = 0; i < 8; i++) {
        var a = (i * 45 + 22) * Math.PI / 180;
        svg += '<line x1="' + Math.cos(a) * r0 + '" y1="' + Math.sin(a) * r0 + '" x2="' + Math.cos(a) * r1 +
               '" y2="' + Math.sin(a) * r1 + '" stroke="#FFB020" stroke-width="' + size * .06 + '" stroke-linecap="round"/>';
      }
      for (var j = 0; j < CORIANDOLI.length; j++) {
        var b = (j * 60 + 5) * Math.PI / 180, q = size * .09;
        svg += '<rect x="' + (Math.cos(b) * dc - q / 2) + '" y="' + (Math.sin(b) * dc - q / 2) + '" width="' + q +
               '" height="' + q + '" rx="' + q * .25 + '" fill="' + CORIANDOLI[j] + '" transform="rotate(' + j * 33 + ' ' +
               Math.cos(b) * dc + ' ' + Math.sin(b) * dc + ')"/>';
      }
      [[-.3, -.08], [.14, .18], [-.06, .26]].forEach(function (o) {
        svg += '<path d="M' + o[0] * size + ' ' + o[1] * size + ' q' + size * .06 + ' ' + -size * .06 + ' ' + size * .12 +
               ' 0" fill="none" stroke="' + TINTA[colore] + '" stroke-width="' + size * .06 + '" stroke-linecap="round"/>';
      });
      var el = document.createElement("div");
      el.className = "scoppio";
      el.style.left = cx + "px";
      el.style.top = cy + "px";
      el.innerHTML = '<svg width="1" height="1" style="overflow:visible">' + svg + "</svg>";
      campo.appendChild(el);
      el.animate([{ transform: "scale(.35)", opacity: 1 }, { transform: "scale(.8)", opacity: 1, offset: .15 },
                  { transform: "scale(1.35)", opacity: 0 }],
                 { duration: 480, easing: "ease-out", fill: "forwards" });
      setTimeout(function () { el.remove(); }, 500);
    }

    // L'orsetto sobbalza di sorpresa a ogni scoppio
    var saltoOrsetto = null;
    function sobbalza() {
      if (saltoOrsetto) saltoOrsetto.cancel();
      saltoOrsetto = orsetto.animate(
        [{ transform: "none" }, { transform: "translateY(-6%) scale(.98,1.03)", offset: .35 },
         { transform: "scale(1.04,.95)", offset: .7 }, { transform: "none" }],
        { duration: 360, easing: "ease-out" });
    }

    function scoppia(p) {
      if (!inCorso || p.popped) return;
      p.popped = true;
      punteggio += CONFIG.PUNTI_PER_PALLONCINO;
      aggiornaInfo();
      BB.sound("pop");

      // Centro del palloncino (la parte gonfia, non il filo)
      var cx = p.x + p.ox + p.size / 2;
      var cy = p.y + p.size * .6;
      scoppio(cx, cy, p.size, p.colore);
      sobbalza();
      if (p.speciale) onda(cx, cy, p.size);

      p.el.animate([{ transform: p.el.style.transform + " scale(1)", opacity: 1 },
                    { transform: p.el.style.transform + " scale(1.25)", opacity: 0 }],
                   { duration: 120, fill: "forwards" });
      removePalloncino(p);
    }

    // Onda dello speciale: fa scoppiare i palloncini entro il raggio, prima i
    // piu' vicini; se ne prende un altro speciale, parte un'altra onda.
    function onda(cx, cy, size) {
      var R = size * CONFIG.SPECIALE_RAGGIO;
      var el = document.createElement("div");
      el.className = "onda";
      el.style.left = cx - R + "px";
      el.style.top = cy - R + "px";
      el.style.width = el.style.height = 2 * R + "px";
      campo.appendChild(el);
      el.animate([{ transform: "scale(.1)", opacity: 1 }, { transform: "scale(1)", opacity: .9, offset: .85 },
                  { transform: "scale(1.05)", opacity: 0 }],
                 { duration: CONFIG.SPECIALE_ONDA_MS * 1.2, easing: "ease-out", fill: "forwards" });
      setTimeout(function () { el.remove(); }, CONFIG.SPECIALE_ONDA_MS * 1.2 + 30);
      BB.sound("match");
      palloncini.slice().forEach(function (q) {
        if (q.popped) return;
        var d = Math.hypot(q.x + q.ox + q.size / 2 - cx, q.y + q.size * .6 - cy);
        if (d <= R) setTimeout(function () { scoppia(q); }, CONFIG.SPECIALE_ONDA_MS * d / R);
      });
    }

    function removePalloncino(p) {
      var idx = palloncini.indexOf(p);
      if (idx >= 0) palloncini.splice(idx, 1);
      // piccolo ritardo per far vedere l'animazione
      setTimeout(function () { if (p.el.parentNode) p.el.remove(); }, 130);
    }

    // Game loop
    function loop(ts) {
      if (!inCorso) return;
      if (!lastTs) lastTs = ts;
      var dt = (ts - lastTs) / 1000;   // delta in secondi
      lastTs = ts;

      // Spawn periodico (più veloce col passare del tempo)
      ultimoSpawn += (ts - (loop._prev || ts));
      loop._prev = ts;
      spawnOgni = Math.max(DIFF.spawnMin, DIFF.spawnBase - (CONFIG.DURATA_PARTITA - tempo) * CONFIG.SPAWN_CALO_MS);
      if (ultimoSpawn > spawnOgni) {
        ultimoSpawn = 0;
        spawn();
      }

      // Aggiorna posizioni
      for (var i = palloncini.length - 1; i >= 0; i--) {
        var p = palloncini[i];
        if (p.popped) continue;
        p.y -= p.vy * dt;
        p.phase += dt * CONFIG.ONDEGGIAMENTO_VELOCITA;
        var ox = p.ox = Math.sin(p.phase) * p.drift;
        var tilt = Math.cos(p.phase) * CONFIG.INCLINAZIONE * (p.drift / CONFIG.ONDEGGIAMENTO_PX);
        p.el.style.transform = "translate(" + (p.x + ox) + "px," + p.y + "px) rotate(" + tilt.toFixed(2) + "deg)";
        // Uscito in cima senza essere scoppiato → rimuovi (nessuna penalità)
        if (p.y < -p.size * 2.1) {
          if (p.el.parentNode) p.el.remove();
          palloncini.splice(i, 1);
        }
      }

      rafId = requestAnimationFrame(loop);
    }

    function mostraStart() { startScreen.classList.remove("bb-hidden"); }

    function avvia(liv) {
      if (CONFIG.DIFFICOLTA[liv]) DIFF = CONFIG.DIFFICOLTA[liv];   // difficoltà scelta dal bambino
      startScreen.classList.add("bb-hidden");
      // Pulisci eventuali palloncini residui
      palloncini.forEach(function (p) { if (p.el.parentNode) p.el.remove(); });
      palloncini = [];
      punteggio = 0;
      tempo = CONFIG.DURATA_PARTITA;
      inCorso = true;
      ultimoSpawn = 9999;       // primo spawn immediato
      lastTs = 0;
      loop._prev = 0;
      aggiornaInfo();

      rafId = requestAnimationFrame(loop);
      tickTimer = setInterval(function () {
        tempo--;
        aggiornaInfo();
        if (tempo <= 0) fine();
      }, 1000);
    }

    function fine() {
      inCorso = false;
      cancelAnimationFrame(rafId);
      clearInterval(tickTimer);
      // Fai sparire i palloncini rimasti
      palloncini.forEach(function (p) { if (p.el.parentNode) p.el.remove(); });
      palloncini = [];

      var record = BB.score("palloncini", punteggio);
      var nuovoRecord = punteggio > 0 && punteggio >= record;
      BB.win({
        mascotte: nuovoRecord ? null : "../assets/icons/palloncini.svg",
        emoji: nuovoRecord ? "🏆" : null,
        titolo: nuovoRecord ? "Nuovo record!" : "Tempo scaduto!",
        punteggio: punteggio + " palloncini",
        record: record,
        rigioca: mostraStart        // torna alla scelta della difficoltà
      });
    }

    // Pulsanti difficoltà: ognuno avvia la partita al suo livello
    Array.prototype.forEach.call(document.querySelectorAll(".liv-btn"), function (b) {
      b.addEventListener("click", function () { avvia(b.dataset.liv); });
    });
  </script>
</body>
</html>
