<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7A1F3D">
  <title>Scoppia i Palloncini</title>
  <link rel="stylesheet" href="../assets/shared.css">
  <style>
    /* Cielo come sfondo del campo di gioco */
    .bb-stage{ padding:0; }
    .campo{
      position:absolute; top:0; right:0; bottom:0; left:0;
      overflow:hidden;
      background:
        radial-gradient(circle at 30% 10%, var(--bb-blue-soft), transparent 60%),
        radial-gradient(circle at 80% 90%, var(--bb-pink-soft), transparent 60%),
        var(--bb-paper);
    }
    /* Un palloncino: cerchio con filo, target tap grande */
    .palloncino{
      position:absolute;
      width:var(--size,96px);
      height:calc(var(--size,96px) * 1.18);
      display:block;              /* NON flex: su Chrome 66 l'altezza % di un flex-item collassa a 0 */
      padding:0; border:0; background:none;
      will-change:transform;
      touch-action:manipulation;
    }
    .palloncino__corpo{
      display:block;                    /* NON inline: altrimenti Chrome 66 ignora width/height */
      width:100%;
      height:var(--size,96px);          /* altezza diretta: su Chrome 66 height:% non risolve qui */
      border-radius:50% 50% 48% 48%;
      box-shadow:inset -8px -10px 0 rgba(0,0,0,.08), var(--bb-shadow);
      position:relative;
    }
    /* Riflesso lucido */
    .palloncino__corpo::before{
      content:"";
      position:absolute;
      top:14%; left:20%;
      width:26%; height:30%;
      border-radius:50%;
      background:rgba(255,255,255,.55);
    }
    /* Filo del palloncino */
    .palloncino__corpo::after{
      content:"";
      position:absolute;
      bottom:-14%; left:50%;
      width:2px; height:16%;
      background:rgba(42,22,34,.4);
      transform:translateX(-50%);
    }
    .palloncino.pop{ animation:bb-pop .18s ease reverse forwards; }

    /* Particelle dello scoppio */
    .particella{
      position:absolute;
      width:14px; height:14px;
      border-radius:50%;
      pointer-events:none;
      will-change:transform, opacity;
    }

    /* Schermata di start */
    .start{
      position:absolute; top:0; right:0; bottom:0; left:0; inset:0; z-index:30;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:22px;
      background:rgba(255,247,251,.92);
      text-align:center;
    }
    .start__emoji{ font-size:18vmin; font-size:clamp(60px,18vmin,130px); }
    .start__img{ width:28vmin; width:clamp(120px,28vmin,200px); height:auto;
      filter:drop-shadow(0 8px 14px rgba(0,0,0,.2)); }
    .start__txt{ font-size:5vmin; font-size:clamp(20px,5vmin,34px); font-weight:900; color:var(--bb-burgundy); }
    .liv-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  </style>
</head>
<body>
  <div class="bb-screen">
    <!-- header iniettato da JS -->
    <div class="bb-stage">
      <div class="campo" id="campo">
        <div class="start" id="start">
          <img class="start__img" src="../assets/mascotte/bolt.png" alt="">
          <div class="start__txt">Scoppia i palloncini!<br>Scegli la difficoltà:</div>
          <div class="liv-row">
            <button class="bb-btn bb-btn--burgundy liv-btn" data-liv="facile">😊 Facile</button>
            <button class="bb-btn bb-btn--burgundy liv-btn" data-liv="medio">😎 Medio</button>
            <button class="bb-btn bb-btn--burgundy liv-btn" data-liv="difficile">🔥 Difficile</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/shared.js"></script>
  <script>
    BB.lockScroll();
    var info = BB.header("🎈 Scoppia i Palloncini");
    BB.idle(60000, BB.home);

    var campo = document.getElementById("campo");
    var startScreen = document.getElementById("start");

    // Palette palloncini (famiglia Big Ben + accenti allegri)
    var COLORI = ["#E8488B", "#2E5BFF", "#7A1F3D", "#FFB020", "#34C759", "#FF6B6B"];
    var DURATA = 60;             // secondi di partita

    // Difficoltà scelta dal bambino a inizio partita (pulsanti nella schermata start).
    // vy = velocità di salita; spawnBase/spawnMin = intervallo tra i palloncini.
    var TAB = {
      facile:    { vyMin: 55, vyMax: 90,  vyScore: 0.8, spawnBase: 1100, spawnMin: 520 },
      medio:     { vyMin: 70, vyMax: 120, vyScore: 1.2, spawnBase: 900,  spawnMin: 380 },
      difficile: { vyMin: 95, vyMax: 150, vyScore: 1.7, spawnBase: 720,  spawnMin: 300 }
    };
    var DIFF = TAB.facile;

    var punteggio = 0;
    var tempo = DURATA;
    var inCorso = false;
    var palloncini = [];          // {el, x, y, vy, size, drift, phase}
    var ultimoSpawn = 0;
    var spawnOgni = 900;          // ms tra una nascita e l'altra (cala col tempo)
    var rafId = null;
    var tickTimer = null;
    var lastTs = 0;

    function aggiornaInfo() {
      info.innerHTML = "⭐ " + punteggio + " &nbsp; ⏱ " + tempo + "s";
    }

    // Crea un palloncino in basso e lo registra nel game loop
    function spawn() {
      var size = BB.rand(78, 130);
      var el = document.createElement("button");
      el.className = "palloncino";
      el.style.setProperty("--size", size + "px");
      var colore = COLORI[BB.rand(0, COLORI.length - 1)];
      el.innerHTML = '<span class="palloncino__corpo" style="background:' + colore + '"></span>';

      var W = campo.clientWidth;
      var H = campo.clientHeight;
      var p = {
        el: el,
        size: size,
        x: BB.rand(10, Math.max(10, W - size - 10)),
        y: H + 20,
        // velocità di salita in px/sec (cresce col punteggio e con la difficoltà)
        vy: BB.rand(DIFF.vyMin, DIFF.vyMax) + punteggio * DIFF.vyScore,
        drift: (Math.random() - 0.5) * 30,   // oscillazione orizzontale
        phase: Math.random() * Math.PI * 2,
        colore: colore,
        popped: false
      };
      el.style.transform = "translate(" + p.x + "px," + p.y + "px)";

      // Tap → scoppia
      el.addEventListener("click", function () { scoppia(p); });
      campo.appendChild(el);
      palloncini.push(p);
    }

    // Genera le particelle colorate dello scoppio
    function particelle(cx, cy, colore) {
      for (var i = 0; i < 10; i++) {
        var part = document.createElement("span");
        part.className = "particella";
        part.style.background = colore;
        part.style.left = cx + "px";
        part.style.top = cy + "px";
        campo.appendChild(part);

        var ang = Math.random() * Math.PI * 2;
        var dist = BB.rand(40, 110);
        var dx = Math.cos(ang) * dist;
        var dy = Math.sin(ang) * dist;
        // Anima con Web Animations API (no librerie)
        part.animate([
          { transform: "translate(0,0) scale(1)", opacity: 1 },
          { transform: "translate(" + dx + "px," + dy + "px) scale(0)", opacity: 0 }
        ], { duration: 500, easing: "cubic-bezier(.2,.7,.3,1)" });
        setTimeout((function (n) { return function () { n.remove(); }; })(part), 520);
      }
    }

    function scoppia(p) {
      if (!inCorso || p.popped) return;
      p.popped = true;
      punteggio++;
      aggiornaInfo();
      BB.sound("pop");

      // Centro del palloncino per le particelle
      var cx = p.x + p.size / 2;
      var cy = p.y + p.size / 2;
      particelle(cx, cy, p.colore);

      p.el.classList.add("pop");
      removePalloncino(p);
    }

    function removePalloncino(p) {
      var idx = palloncini.indexOf(p);
      if (idx >= 0) palloncini.splice(idx, 1);
      // piccolo ritardo per far vedere l'animazione pop
      setTimeout(function () { if (p.el.parentNode) p.el.remove(); }, 180);
    }

    // Game loop
    function loop(ts) {
      if (!inCorso) return;
      if (!lastTs) lastTs = ts;
      var dt = (ts - lastTs) / 1000;   // delta in secondi
      lastTs = ts;

      // Spawn periodico (più veloce col passare del tempo)
      ultimoSpawn += (ts - (loop._prev || ts));
      loop._prev = ts;
      spawnOgni = Math.max(DIFF.spawnMin, DIFF.spawnBase - (DURATA - tempo) * 8);
      if (ultimoSpawn > spawnOgni) {
        ultimoSpawn = 0;
        spawn();
      }

      // Aggiorna posizioni
      var H = campo.clientHeight;
      for (var i = palloncini.length - 1; i >= 0; i--) {
        var p = palloncini[i];
        if (p.popped) continue;
        p.y -= p.vy * dt;
        p.phase += dt * 2;
        var ox = Math.sin(p.phase) * (p.drift * 0.1);
        p.el.style.transform = "translate(" + (p.x + ox) + "px," + p.y + "px)";
        // Uscito in cima senza essere scoppiato → rimuovi (nessuna penalità)
        if (p.y < -p.size * 1.4) {
          if (p.el.parentNode) p.el.remove();
          palloncini.splice(i, 1);
        }
      }

      rafId = requestAnimationFrame(loop);
    }

    function mostraStart() { startScreen.classList.remove("bb-hidden"); }

    function avvia(liv) {
      if (TAB[liv]) DIFF = TAB[liv];   // difficoltà scelta dal bambino
      startScreen.classList.add("bb-hidden");
      // Pulisci eventuali palloncini residui
      palloncini.forEach(function (p) { if (p.el.parentNode) p.el.remove(); });
      palloncini = [];
      punteggio = 0;
      tempo = DURATA;
      inCorso = true;
      ultimoSpawn = 9999;       // primo spawn immediato
      lastTs = 0;
      loop._prev = 0;
      aggiornaInfo();

      rafId = requestAnimationFrame(loop);
      tickTimer = setInterval(function () {
        tempo--;
        aggiornaInfo();
        if (tempo <= 0) fine();
      }, 1000);
    }

    function fine() {
      inCorso = false;
      cancelAnimationFrame(rafId);
      clearInterval(tickTimer);
      // Fai sparire i palloncini rimasti
      palloncini.forEach(function (p) { if (p.el.parentNode) p.el.remove(); });
      palloncini = [];

      var record = BB.score("palloncini", punteggio);
      var nuovoRecord = punteggio > 0 && punteggio >= record;
      BB.win({
        mascotte: nuovoRecord ? null : "../assets/mascotte/bolt.png",
        emoji: nuovoRecord ? "🏆" : null,
        titolo: nuovoRecord ? "Nuovo record!" : "Tempo scaduto!",
        punteggio: punteggio + " palloncini",
        record: record,
        rigioca: mostraStart        // torna alla scelta della difficoltà
      });
    }

    // Pulsanti difficoltà: ognuno avvia la partita al suo livello
    Array.prototype.forEach.call(document.querySelectorAll(".liv-btn"), function (b) {
      b.addEventListener("click", function () { avvia(b.dataset.liv); });
    });
  </script>
</body>
</html>
