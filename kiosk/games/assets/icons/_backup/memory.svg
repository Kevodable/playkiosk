<?xml version="1.0" encoding="UTF-8"?>
<!-- Icona "Abbina le Coppie" — ventaglio di carte con cuore e stella. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Memory">
  <circle cx="120" cy="120" r="113" fill="#FFFFFF" stroke="#EADFE6" stroke-width="3"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#FFD3E4" stroke-width="7" opacity=".45"/>
  <!-- stelline decorative -->
  <g fill="#FFD23F">
    <path d="M44 96 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z"/>
    <path d="M196 70 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z"/>
    <path d="M198 158 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z"/>
  </g>
  <!-- ombra morbida sotto le carte -->
  <ellipse cx="120" cy="183" rx="68" ry="12" fill="#2A1622" opacity=".10"/>

  <!-- carta retro (blu) -->
  <g transform="rotate(-20 88 122)">
    <rect x="48" y="64" width="76" height="104" rx="13" fill="#2E5BFF"/>
    <rect x="48" y="64" width="76" height="104" rx="13" fill="none" stroke="#1E40D8" stroke-width="3"/>
    <rect x="57" y="73" width="58" height="86" rx="9" fill="none" stroke="#7C97FF" stroke-width="3"/>
    <path d="M86 96 l5 12 13 1 -10 9 3 13 -11 -7 -11 7 3 -13 -10 -9 13 -1 Z" fill="#FFD23F"/>
  </g>

  <!-- carta stella (gialla, dietro a destra) -->
  <g transform="rotate(18 150 120)">
    <rect x="118" y="62" width="74" height="102" rx="13" fill="#FFE08A"/>
    <rect x="118" y="62" width="74" height="102" rx="13" fill="none" stroke="#F6B400" stroke-width="3"/>
    <path d="M155 96 l5 12 13 1 -10 9 3 13 -11 -7 -11 7 3 -13 -10 -9 13 -1 Z" fill="#FFB020"/>
  </g>

  <!-- carta cuore (rosa, davanti) -->
  <g transform="rotate(2 120 118)">
    <rect x="84" y="58" width="78" height="108" rx="14" fill="#FFD3E4"/>
    <rect x="84" y="58" width="78" height="108" rx="14" fill="none" stroke="#fff" stroke-width="4"/>
    <rect x="84" y="58" width="78" height="108" rx="14" fill="none" stroke="#F6A8C8" stroke-width="2"/>
    <path d="M123 146 C99 128 101 102 117 102 C125 102 123 110 123 110 C123 110 121 102 129 102 C145 102 147 128 123 146 Z" fill="#E8488B"/>
    <ellipse cx="104" cy="78" rx="7" ry="11" fill="#fff" opacity=".7"/>
  </g>
</svg>
