<?xml version="1.0" encoding="UTF-8"?>
<!-- Icona "Tris" — griglia con X e O. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Tris">
  <circle cx="120" cy="120" r="113" fill="#FFFFFF" stroke="#EADFE6" stroke-width="3"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#FFD3E4" stroke-width="7" opacity=".5"/>
  <g stroke="#B9A7C6" stroke-width="7" stroke-linecap="round">
    <line x1="105" y1="58" x2="105" y2="182"/>
    <line x1="150" y1="58" x2="150" y2="182"/>
    <line x1="58" y1="105" x2="182" y2="105"/>
    <line x1="58" y1="150" x2="182" y2="150"/>
  </g>
  <!-- X in alto a sinistra -->
  <g stroke="#E8488B" stroke-width="13" stroke-linecap="round">
    <line x1="70" y1="70" x2="93" y2="93"/>
    <line x1="93" y1="70" x2="70" y2="93"/>
  </g>
  <!-- O al centro -->
  <circle cx="127" cy="127" r="15" fill="none" stroke="#2E5BFF" stroke-width="12"/>
  <!-- X in basso a destra -->
  <g stroke="#E8488B" stroke-width="13" stroke-linecap="round">
    <line x1="159" y1="159" x2="173" y2="173"/>
    <line x1="173" y1="159" x2="159" y2="173"/>
  </g>
</svg>
