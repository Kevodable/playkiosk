<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3346D6">
  <title>Labirinto</title>
  <link rel="stylesheet" href="../assets/shared.css">
  <style>
    .bb-stage{ padding:8px 14px 16px; }
    .arena{
      position:relative;
      width:86vmin; width:min(86vmin, 560px);
      aspect-ratio:1/1;
      border-radius:22px;
      background:#fff;
      box-shadow:var(--bb-shadow-strong);
      overflow:hidden; touch-action:none;
    }
    .arena canvas{ display:block; width:100%; height:100%; }

    .start{ position:absolute; top:0; right:0; bottom:0; left:0; inset:0; z-index:30; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:20px;
      background:rgba(255,247,251,.95); text-align:center; padding:18px; }
    .start__img{ width:24vmin; width:clamp(110px,24vmin,180px); height:auto;
      filter:drop-shadow(0 8px 14px rgba(0,0,0,.2)); }
    .start__txt{ font-size:4.4vmin; font-size:clamp(18px,4.4vmin,30px); font-weight:900; color:var(--bb-burgundy); line-height:1.3; }
    .liv-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
    @supports not (aspect-ratio: 1 / 1){ .arena{ height:86vmin; } }
  </style>
</head>
<body>
  <div class="bb-screen">
    <div class="bb-stage">
      <div class="arena" id="arena">
        <canvas id="canvas"></canvas>
        <div class="start" id="start">
          <img class="start__img" src="../assets/mascotte/bolt.png" alt="">
          <div class="start__txt">Porta il topino 🐭 al formaggio 🧀<br>col dito, senza toccare i muri!<br>Scegli la difficoltà:</div>
          <div class="liv-row">
            <button class="bb-btn liv-btn" data-liv="facile">😊 Facile</button>
            <button class="bb-btn liv-btn" data-liv="medio">😎 Medio</button>
            <button class="bb-btn liv-btn" data-liv="difficile">🔥 Difficile</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/shared.js"></script>
  <script>
    BB.lockScroll();
    var info = BB.header("🧩 Labirinto");
    BB.idle(90000, BB.home);

    var arena  = document.getElementById("arena");
    var canvas = document.getElementById("canvas");
    var ctx    = canvas.getContext("2d");
    var startScreen = document.getElementById("start");

    // Colori
    var WALL = "#3346D6", PATH = "#FFFFFF", TRAIL = "#E8488B";
    var START_BG = "#CDEFD6", GOAL_BG = "#FFE9A8";

    // Difficoltà = numero di "stanze" per lato (più stanze = labirinto più grande)
    var TAB = { facile: 6, medio: 8, difficile: 11 };

    var N = 6, W = 13;        // W = 2*N+1 (griglia fine)
    var open = [];            // open[r][c] = cella percorribile
    var S = 0, cell = 0;      // lato in px CSS e dimensione cella
    var attivo = false, last = null, tStart = 0, vintoFlag = false;

    // ---- Generazione labirinto (recursive backtracker iterativo) ----
    function genera(n){
      W = 2*n + 1;
      open = [];
      for (var r=0; r<W; r++){ open[r]=[]; for (var c=0;c<W;c++) open[r][c]=false; }
      var vis=[]; for (var i=0;i<n;i++){ vis[i]=[]; for (var j=0;j<n;j++) vis[i][j]=false; }
      function room(i,j){ open[2*i+1][2*j+1]=true; }
      room(0,0); vis[0][0]=true;
      var stack=[[0,0]];
      var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
      while (stack.length){
        var cur=stack[stack.length-1], ci=cur[0], cj=cur[1];
        var nbrs=[];
        for (var d=0; d<4; d++){
          var ni=ci+dirs[d][0], nj=cj+dirs[d][1];
          if (ni>=0&&ni<n&&nj>=0&&nj<n&&!vis[ni][nj]) nbrs.push([ni,nj]);
        }
        if (!nbrs.length){ stack.pop(); continue; }
        var nx=nbrs[BB.rand(0,nbrs.length-1)], ni=nx[0], nj=nx[1];
        vis[ni][nj]=true;
        room(ni,nj);
        open[ci+ni+1][cj+nj+1]=true;   // abbatte il muro tra le due stanze
        stack.push([ni,nj]);
      }
    }

    // ---- Disegno ----
    function fit(){
      var dpr = window.devicePixelRatio || 1;
      S = arena.clientWidth;
      canvas.width  = Math.round(S*dpr);
      canvas.height = Math.round(S*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      cell = S / W;
    }

    function disegnaMaze(){
      ctx.clearRect(0,0,S,S);
      ctx.fillStyle = WALL; ctx.fillRect(0,0,S,S);
      ctx.fillStyle = PATH;
      for (var r=0;r<W;r++) for (var c=0;c<W;c++)
        if (open[r][c]) ctx.fillRect(c*cell, r*cell, cell+0.6, cell+0.6);

      // evidenzia partenza e arrivo
      ctx.fillStyle = START_BG; ctx.fillRect(1*cell, 1*cell, cell, cell);
      ctx.fillStyle = GOAL_BG;  ctx.fillRect((W-2)*cell, (W-2)*cell, cell, cell);

      // marcatori
      ctx.font = Math.floor(cell*0.8) + "px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("🐭", 1.5*cell, 1.5*cell);
      ctx.fillText("🧀", (W-1.5)*cell, (W-1.5)*cell);
    }

    // ---- Util coordinate ----
    function pos(e){ var rc=canvas.getBoundingClientRect(); return { x:e.clientX-rc.left, y:e.clientY-rc.top }; }
    function cellOf(p){ return { row: Math.floor(p.y/cell), col: Math.floor(p.x/cell) }; }
    function isGoal(rc){ return rc.row===W-2 && rc.col===W-2; }
    function isStart(rc){ return rc.row===1 && rc.col===1; }

    // Muro colpito? con tolleranza ai bordi (perdona lo sfioramento)
    function muro(p){
      var col=Math.floor(p.x/cell), row=Math.floor(p.y/cell);
      if (row<0||row>=W||col<0||col>=W) return true;
      if (open[row][col]) return false;
      var fx = p.x/cell - col, fy = p.y/cell - row;
      return (fx>0.22 && fx<0.78 && fy>0.22 && fy<0.78);
    }

    // ---- Interazione (traccia col dito) ----
    canvas.addEventListener("pointerdown", function(e){
      if (vintoFlag) return;
      var p=pos(e);
      if (!isStart(cellOf(p))) return;     // si parte solo dal topino
      e.preventDefault();
      attivo=true; last=p; tStart=performance.now();
      ctx.strokeStyle=TRAIL; ctx.lineWidth=Math.max(6, cell*0.42);
      ctx.lineCap="round"; ctx.lineJoin="round";
      if (canvas.setPointerCapture){ try{ canvas.setPointerCapture(e.pointerId); }catch(_){ } }
    });

    canvas.addEventListener("pointermove", function(e){
      if (!attivo) return;
      e.preventDefault();
      var p=pos(e);
      var dx=p.x-last.x, dy=p.y-last.y, dist=Math.sqrt(dx*dx+dy*dy);
      var steps=Math.max(1, Math.ceil(dist/(cell*0.45)));
      for (var k=1;k<=steps;k++){
        var q={ x:last.x+dx*k/steps, y:last.y+dy*k/steps };
        var rc=cellOf(q);
        if (isGoal(rc)){ traccia(q); return vinto(); }
        if (muro(q)) return fallita();
      }
      traccia(p);
    }, { passive:false });

    function fineTocco(){ if (attivo && !vintoFlag){ attivo=false; disegnaMaze(); } }
    canvas.addEventListener("pointerup", fineTocco);
    canvas.addEventListener("pointercancel", fineTocco);
    canvas.addEventListener("pointerleave", fineTocco);

    function traccia(p){ ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; }

    function fallita(){
      attivo=false;
      BB.sound("error");
      arena.classList.add("bb-anim-shake");
      setTimeout(function(){ arena.classList.remove("bb-anim-shake"); disegnaMaze(); }, 420);
    }

    // Record = tempo minimo (più basso è meglio), salvato a mano in localStorage
    function bestTime(t){
      var k="bb.kidsfunplanet.besttime.labirinto." + N;
      var cur=0; try{ cur=parseFloat(localStorage.getItem(k))||0; }catch(_){}
      if (t!=null && (cur===0 || t<cur)){ try{ localStorage.setItem(k,String(t)); }catch(_){} return t; }
      return cur;
    }

    function vinto(){
      attivo=false; vintoFlag=true;
      var t = Math.round((performance.now()-tStart)/100)/10;   // secondi, 1 decimale
      var prima = bestTime();
      var record = bestTime(t);
      var nuovoRecord = (prima===0 || t<=prima);
      BB.win({
        emoji: nuovoRecord ? "🏆" : "🧀",
        titolo: nuovoRecord ? "Nuovo record!" : "Evviva, formaggio!",
        punteggio: "Tempo: " + t + "s",
        record: "miglior tempo " + record + "s",
        rigioca: mostraStart
      });
    }

    function mostraStart(){ vintoFlag=false; startScreen.classList.remove("bb-hidden"); }

    function avvia(liv){
      N = TAB[liv] || 6;
      startScreen.classList.add("bb-hidden");
      vintoFlag=false; attivo=false; last=null;
      genera(N); fit(); disegnaMaze();
      info.innerHTML = "🐭 → 🧀";
    }

    window.addEventListener("resize", function(){ if (!startScreen.classList.contains("bb-hidden")) return; fit(); disegnaMaze(); });

    Array.prototype.forEach.call(document.querySelectorAll(".liv-btn"), function(b){
      b.addEventListener("click", function(){ avvia(b.dataset.liv); });
    });
  </script>
</body>
</html>
