<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7A1F3D">
  <title>Memory</title>
  <link rel="stylesheet" href="../assets/shared.css">
  <style>
    /* --- Cielo notturno chiaro: il gufo e' un animale della sera --- */
    .bb-screen{
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,.7) 0 2px, transparent 3px) 0 0 / 90px 90px,
        radial-gradient(circle at 64% 42%, rgba(255,255,255,.55) 0 1.5px, transparent 2.5px) 0 0 / 70px 70px,
        linear-gradient(to bottom, #CFE0FF 0%, #E3DAFF 55%, #F6ECF6 100%);
    }
    .bb-header{ background:rgba(255,255,255,.55); }

    /* --- Info nell'header (mosse / tempo / coppie) --- */
    .mem-stats{ display:flex; align-items:center; gap:14px; }
    .mem-stat{ display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
    .mem-stat b{ color:var(--bb-burgundy); }

    /* --- Gufo in basso a sinistra --- */
    .gufo{
      position:absolute; left:1vmin; bottom:0;
      height:30vmin; height:clamp(150px,30vmin,300px); width:auto;
      pointer-events:none;
      transform-origin:50% 100%;
      z-index:2;
    }

    /* --- Board --- */
    .board{
      position:relative;
      width:80vmin; width:min(80vmin, 560px);
      height:80vmin; height:min(80vmin, 560px);
      display:grid;
      grid-template-columns:repeat(4,1fr);
      grid-template-rows:repeat(4,1fr);
      gap:1.6vmin;
    }
    .board.large{
      grid-template-columns:repeat(6,1fr);
      grid-template-rows:repeat(6,1fr);
      gap:1.1vmin;
    }

    .card{ position:relative; perspective:700px; cursor:pointer; touch-action:manipulation; }
    .card-inner{
      width:100%; height:100%;
      position:relative;
      transition:transform .45s cubic-bezier(.4,.2,.2,1);
      transform-style:preserve-3d;
    }
    .card.flipped .card-inner,
    .card.matched .card-inner{ transform:rotateY(180deg); }

    .card-face{
      position:absolute;
      top:0; right:0; bottom:0; left:0;
      display:flex; align-items:center; justify-content:center;
      border-radius:14%;
      -webkit-backface-visibility:hidden; backface-visibility:hidden;
      overflow:hidden;
    }
    /* Dorso come nell'icona: blu, cornice bianca, cerchio giallo */
    .card-front{
      background:#5B86DB;
      border:.35vmin solid #3E5FAE; border-width:max(.35vmin,3px);
      box-shadow:0 4px 10px rgba(40,60,120,.25);
    }
    .card-front::before{
      content:""; position:absolute; inset:9%;
      border:max(.3vmin,2px) solid rgba(255,255,255,.85); border-radius:10%;
    }
    .card-front::after{
      content:""; width:42%; aspect-ratio:1; border-radius:50%;
      background:radial-gradient(circle, #fff 0 32%, #FFD23F 34% 100%);
      box-shadow:0 0 0 max(.3vmin,2px) #3E5FAE;
    }
    /* Faccia come le carte del gufo: crema con bordo azzurro */
    .card-back{
      background:linear-gradient(to bottom, #FDF7F3, #F6ECEF);
      border:max(.45vmin,3px) solid #8FA6E0;
      transform:rotateY(180deg);
      font-size:8vmin; font-size:min(8vmin,46px);
      box-shadow:0 4px 10px rgba(40,60,120,.2);
    }
    .board.large .card-back{ font-size:min(6vmin,34px); }
    .card-back img{ width:82%; height:82%; object-fit:contain; }
    .card.matched .card-back{ border-color:#FFC83D; box-shadow:0 0 0 max(.3vmin,2px) #FFE58A, 0 4px 14px rgba(255,190,40,.45); }
    .card.mismatch .card-inner{ animation:mem-shake .4s; }
    @keyframes mem-shake{
      0%,100%{ transform:rotateY(180deg) translateX(0); }
      25%{ transform:rotateY(180deg) translateX(-6px); }
      75%{ transform:rotateY(180deg) translateX(6px); }
    }

    /* --- Schermata di start (come gli altri giochi) --- */
    .start{
      position:absolute; top:0; right:0; bottom:0; left:0; inset:0; z-index:30;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:18px;
      background:rgba(240,236,255,.92);
      text-align:center;
    }
    .start__img{ width:34vmin; width:clamp(150px,34vmin,260px); height:auto;
      filter:drop-shadow(0 8px 14px rgba(0,0,0,.2)); }
    .start__txt{ font-size:3.2vmin; font-size:clamp(18px,3.2vmin,30px);
      font-weight:900; color:#3E3A8C; }
    .liv-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  </style>
</head>
<body>
  <div class="bb-screen">
    <!-- header iniettato da JS -->
    <div class="bb-stage">
      <img class="gufo" id="gufo" src="img/gufo.webp" alt="">
      <div class="board" id="board"></div>
      <div class="start" id="start">
        <img class="start__img" src="../assets/icons/memory.svg" alt="">
        <div class="start__txt">Trova tutte le coppie!<br>Che difficoltà vuoi?</div>
        <div class="liv-row">
          <button class="bb-btn bb-btn--burgundy liv-btn" data-pairs="8">🌈 Facile (4×4)</button>
          <button class="bb-btn bb-btn--blue liv-btn" data-pairs="18">🚀 Difficile (6×6)</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/shared.js"></script>
  <script src="script.js"></script>
</body>
</html>
